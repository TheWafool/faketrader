[package]
name = "faketrader"
version = "0.1.0"
edition = "2024"
authors = ["waffled"]
description = "Paper trading trainer: replay real charts bar by bar, quiz yourself on patterns, journal every trade"
license = "MIT"
readme = "README.md"
keywords = ["trading", "paper-trading", "stocks", "trainer", "egui"]
categories = ["finance", "gui"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
egui = "0.37"
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Installers for every desktop OS: `cargo packager --release`.
[package.metadata.packager]
product-name = "FakeTrader"
identifier = "dev.faketrader.FakeTrader"
publisher = "FakeTrader"
category = "Finance"
description = "Practice trading on real charts without risking money"
icons = ["assets/icon-256.png", "assets/icon-512.png", "assets/icon.ico"]
before-packaging-command = "cargo build --release"
out-dir = "dist"
binaries = [{ path = "faketrader", main = true }]
long-description = "Replay real stock charts bar by bar with the future hidden, quiz yourself on candlestick and chart patterns, paper trade live prices, and keep a journal with R-multiples and coaching notes."
license-file = "LICENSE"

[package.metadata.packager.deb]
package-name = "faketrader"
section = "misc"
depends = ["libc6", "libgl1", "libxkbcommon0", "libwayland-client0", "libx11-6", "libxcursor1", "libxrandr2", "libxi6"]
desktop-template = "packaging/linux/faketrader.desktop"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
